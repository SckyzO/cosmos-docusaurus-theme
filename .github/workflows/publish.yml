name: Publish to npm & GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v2.1.0)"
        required: true
        # No default — forces explicit input to avoid accidental republish
      skip_npm:
        description: "Skip npm publish"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_docker:
        description: "Skip Docker build+push"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write

jobs:
  # The image goes out before npm. A GHCR tag can be pushed again, but an npm
  # version can never be republished, so a failed scan or push has to stop the
  # release before npm. In the old order, 2.2.5 reached npm, failed the scan,
  # and was left with no image and no GitHub Release.
  build-docker:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.skip_docker != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract version tag
        id: meta
        run: |
          REF="${{ github.event.inputs.ref || github.ref }}"
          TAG="${REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # container-scan.yml replays these two steps every week; change both files
      # together.
      - name: Build Docker image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: cosmos-docusaurus-theme:scan

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: "cosmos-docusaurus-theme:scan"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/sckyzo/cosmos-docusaurus-theme:latest
            ghcr.io/sckyzo/cosmos-docusaurus-theme:${{ steps.meta.outputs.tag }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-docker
    # OIDC trusted publishing — no long-lived npm token (npm bypass-2FA tokens
    # are being deprecated). Requires a trusted publisher configured for this
    # package on npmjs.com (GitHub Actions -> SckyzO/cosmos-docusaurus-theme,
    # workflow publish.yml). Job-scoped permissions override the top-level block.
    permissions:
      id-token: write # mint the OIDC token npm exchanges for publish auth
      contents: read
    # Also runs when build-docker was skipped by skip_docker. !cancelled(), not
    # always(): always() would run it even after the workflow is cancelled.
    if: ${{ !cancelled() && !failure() && github.event.inputs.skip_npm != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node.js with npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 + latest npm — OIDC trusted publishing needs npm >= 11.5.1.
          # Kept in step with CI so we publish on the runtime we tested on.
          # No dependency cache in release builds (npm guidance).
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run full lint suite before publish
        run: npm run lint

      - name: Publish package to npm (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN — npm authenticates via the GitHub OIDC token.
        run: npm publish --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-docker]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          echo "$NOTES" > /tmp/release-notes.md
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.changelog.outputs.tag }}"
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo ${{ github.repository }} \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
