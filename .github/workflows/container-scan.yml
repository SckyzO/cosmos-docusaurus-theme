name: Container scan

# Replays the release scan from publish.yml (build the demo image, fail on any
# fixable HIGH or CRITICAL finding) with the current Trivy database, so a
# finding disclosed after a merge fails this run instead of the next release.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:
  # Changes to the scan's own inputs get scanned before they reach main
  pull_request:
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  scan:
    name: Scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # These two steps must match the scan in publish.yml's build-docker job:
      # this run only predicts the release if it scans the same image the same
      # way.
      - name: Build Docker image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: cosmos-docusaurus-theme:scan

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: "cosmos-docusaurus-theme:scan"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
